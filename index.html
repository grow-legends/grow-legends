// Shop-Liste im Stil der Vorlage: blaue Kopfzeile mit Blatt + Geld,
// Liste mit Preisen, Beschreibung unten
function drawShopMenu(m) {
  const w = Math.min(VIEW_W - 8, 230), x = Math.round((VIEW_W - w) / 2);
  const descH = 32, headH = 16;
  const maxRows = Math.max(3, Math.floor((VIEW_H - 16 - headH - descH - 16) / LINE_H));
  const rows = Math.min(maxRows, Math.max(1, m.items.length));
  if (m.sel < m.scroll) m.scroll = m.sel;
  if (m.sel >= m.scroll + rows) m.scroll = m.sel - rows + 1;
  const listH = rows * LINE_H + 10;
  const total = headH + 2 + listH + 2 + descH;
  const y = Math.max(4, Math.round((VIEW_H - total) / 2));
  // Kopfzeile
  px(ctx, C.ink, x, y, w, headH); px(ctx, "#34447a", x + 1, y + 1, w - 2, headH - 2);
  px(ctx, C.white, x + 3, y + 2, 12, 12); px(ctx, GS.sign, x + 4, y + 3, 10, 10); drawLeafIcon(ctx, x + 4, y + 3, C.white);
  drawText(ctx, m.title, x + 20, y + 4, C.white, "#1a2448");
  const money = euro(STATE.money); drawText(ctx, money, x + w - 6 - textWidth(money), y + 4, C.white, "#1a2448");
  // Liste
  const ly = y + headH + 2;
  drawBox(x, ly, w, listH);
  if (!m.items.length) drawText(ctx, m.empty || "–", x + 10, ly + 6);
  for (let r = 0; r < rows && m.scroll + r < m.items.length; r++) {
    const i = m.scroll + r, it = m.items[i], ty = ly + 6 + r * LINE_H;
    if (i === m.sel) drawText(ctx, "▶", x + 7, ty);
    drawText(ctx, it.label, x + 15, ty, it.disabled ? "#a8a8b0" : C.uiText);
    if (it.right) drawText(ctx, it.right, x + w - 8 - textWidth(it.right), ty, it.disabled ? "#a8a8b0" : C.uiText);
  }
  if (m.scroll > 0) drawText(ctx, "↑", x + w - 10, ly - 1, C.uiBorder, null);
  if (m.scroll + rows < m.items.length) drawText(ctx, "↓", x + w - 10, ly + listH - 9, C.uiBorder, null);
  // Beschreibung
  const dy = ly + listH + 2;
  drawBox(x, dy, w, descH);
  const sel = m.items[m.sel];
  if (sel && sel.desc) wrapText(sel.desc, w - 20).slice(0, 2).forEach((l, i) => drawText(ctx, l, x + 10, dy + 7 + i * LINE_H));
}

/* =====================================================================
   16. EINRICHTEN – Möbel umstellen und Zelte aufstellen (nur Wohnung)
   ---------------------------------------------------------------------
   Menü (B) → "Einrichten". Ein Cursor läuft über den Raum:
     A auf ein bewegliches Möbelstück / Zelt -> aufnehmen
     A erneut                                -> abstellen (grün = geht, rot = geht nicht)
     B                                       -> abbrechen bzw. Einrichten beenden
   Beweglich ist alles mit  movable: true  in MAPS.apartment + alle Zelte.
   Bett, Küche, Bad, Schreibtisch, Fernseher usw. bleiben fest.
   ===================================================================== */
const FURNISH_MAP = "apartment";
const FURNISH_KEEP_FREE = [{ x: 6, y: 14 }, { x: 6, y: 15 }];   // Eingang muss frei bleiben

// Baut die Objektliste der Wohnung aus Karte + Spielstand
function arrangeApartment(objects) {
  const held = GAME.furnish && GAME.furnish.held;
  const out = [];
  for (const o of objects) {
    if (held && held.kind === "furn" && held.id === o.id) continue;       // wird gerade getragen
    const pos = o.id && STATE.furniture[o.id];
    out.push(pos ? { ...o, x: pos.x, y: pos.y } : o);
  }
  for (const tent of STATE.tents) {
    if (held && held.kind === "tent" && held.tent === tent) continue;
    const it = ITEMS[tent.item];
    out.push({ type: "growTent", x: tent.x, y: tent.y, w: it.w, h: it.h, tent, movable: true,
      interact: { kind: "tent", hint: `Zelt ${STATE.tents.indexOf(tent) + 1} öffnen` } });
  }
  return out;
}
function rebuildApartment() {
  delete MAP_CACHE[FURNISH_MAP];
  if (GAME.mapId === FURNISH_MAP) GAME.map = getMap(FURNISH_MAP);
}

function openFurnish() {
  if (GAME.mapId !== FURNISH_MAP) { openDialog("Einrichten kannst du nur in deiner Wohnung."); return; }
  const tents = invOf("tent");
  if (!tents.length) { startFurnish(null); return; }
  openMenu({
    title: "EINRICHTEN",
    items: [{ label: "Möbel umstellen", id: null }, ...tents.map(id => ({ label: ITEMS[id].name + " aufstellen", right: "×" + invCount(id), id }))],
    onChoose: (it) => startFurnish(it.id),
  });
}
function startFurnish(newTentItem) {
  const p = GAME.player, [dx, dy] = DIRS[p.dir];
  GAME.furnish = { cx: clamp(p.x + dx, 0, GAME.map.W - 1), cy: clamp(p.y + dy, 0, GAME.map.H - 1), held: null, repeat: 0 };
  if (newTentItem) GAME.furnish.held = { kind: "new", item: newTentItem, type: "growTent", w: ITEMS[newTentItem].w, h: ITEMS[newTentItem].h, name: ITEMS[newTentItem].name };
  GAME.camFocus = { x: GAME.furnish.cx, y: GAME.furnish.cy };
  GAME.screen = { type: "furnish", update: updateFurnish, render: renderFurnish };
  Sound.select();
}
function endFurnish() {
  GAME.furnish = null; GAME.camFocus = null; GAME.screen = null;
  rebuildApartment(); saveGame();
}

// Findet ein bewegliches Objekt unter dem Cursor
function movableAt(x, y) {
  return GAME.map.objects.find(o => o.movable && covers(o, x, y)) || null;
}
// Darf das getragene Objekt an (x, y) stehen?
function canPlace(held, x, y) {
  const m = GAME.map, p = GAME.player;
  const tiles = [];
  for (let yy = y; yy < y + held.h; yy++) for (let xx = x; xx < x + held.w; xx++) tiles.push([xx, yy]);
  for (const [xx, yy] of tiles) {
    if (xx < 0 || yy < 0 || xx >= m.W || yy >= m.H) return false;
    if (m.solid[yy][xx]) return false;
    if (xx === p.x && yy === p.y) return false;
    if (FURNISH_KEEP_FREE.some(f => f.x === xx && f.y === yy)) return false;
    if (m.def.tiles[yy][xx] === "b") return false;                   // nicht ins Bad
  }
  // Der Spieler muss danach noch zur Tür kommen (niemand sperrt sich ein)
  const blocked = new Set(tiles.map(([a, b]) => a + "," + b));
  const seen = new Set([p.x + "," + p.y]), queue = [[p.x, p.y]];
  while (queue.length) {
    const [qx, qy] = queue.shift();
    if (qx === FURNISH_KEEP_FREE[0].x && qy === FURNISH_KEEP_FREE[0].y) return true;
    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = qx + dx, ny = qy + dy, k = nx + "," + ny;
      if (seen.has(k) || blocked.has(k) || isBlocked(m, nx, ny)) continue;
      seen.add(k); queue.push([nx, ny]);
    }
  }
  return false;
}

function updateFurnish(dt) {
  const f = GAME.furnish;
  // Cursor bewegen (gedrückt halten = wiederholen)
  const d = Input.dir();
  const fresh = ["up", "down", "left", "right"].find(b => Input.consume(b));
  f.repeat = d ? f.repeat + dt : 0;
  const step = fresh || (d && f.repeat > 0.3 && (f.repeat = 0.22, d));
  if (step) {
    const [dx, dy] = DIRS[step];
    f.cx = clamp(f.cx + dx, 0, GAME.map.W - 1); f.cy = clamp(f.cy + dy, 0, GAME.map.H - 1);
    GAME.camFocus = { x: f.cx, y: f.cy };
    Sound.select();
  }
  if (Input.consume("a")) {
    if (!f.held) {
      const o = movableAt(f.cx, f.cy);
      if (!o) { Sound.bump(); return; }
      f.held = o.tent
        ? { kind: "tent", tent: o.tent, type: "growTent", w: o.w, h: o.h, name: `Zelt ${STATE.tents.indexOf(o.tent) + 1}` }
        : { kind: "furn", id: o.id, obj: o, type: o.type, w: o.w, h: o.h, name: furnName(o) };
      f.cx = o.x; f.cy = o.y; GAME.camFocus = { x: f.cx, y: f.cy };
      rebuildApartment(); Sound.confirm();
    } else {
      if (!canPlace(f.held, f.cx, f.cy)) { Sound.bump(); return; }
      const h = f.held;
      if (h.kind === "furn") STATE.furniture[h.id] = { x: f.cx, y: f.cy };
      else if (h.kind === "tent") { h.tent.x = f.cx; h.tent.y = f.cy; }
      else {
        invAdd(h.item, -1);
        STATE.tents.push({ id: STATE.nextTentId++, item: h.item, x: f.cx, y: f.cy, addons: {}, plants: new Array(ITEMS[h.item].slots).fill(null) });
      }
      f.held = null; rebuildApartment(); saveGame(); Sound.floor();
    }
  } else if (Input.consume("b")) {
    if (f.held) { f.held = null; rebuildApartment(); Sound.cancel(); }
    else { Sound.cancel(); endFurnish(); }
  }
}
function furnName(o) {
  return { sofa: "Sofa", coffeeTable: "Couchtisch", plant: "Pflanze", wardrobe: "Schrank", diningTable: "Esstisch", diningChair: "Stuhl" }[o.type] || "Möbel";
}

function renderFurnish() {
  const f = GAME.furnish, cam = GAME.cam, t = GAME.time;
  const sx = f.cx * TILE - cam.x, sy = f.cy * TILE - cam.y;
  const w = f.held ? f.held.w : 1, h = f.held ? f.held.h : 1;
  // getragenes Objekt halbdurchsichtig am Cursor
  if (f.held) {
    const ghost = f.held.kind === "furn" ? { ...f.held.obj, x: f.cx, y: f.cy }
      : { type: "growTent", w, h, tent: f.held.tent || { addons: {}, plants: [] } };
    ctx.globalAlpha = 0.7;
    if (f.held.kind === "new") STATE.tents.push(ghost.tent);     // nur für die Nummer auf dem Zelt
    OBJECT_TYPES[f.held.type].draw(ctx, sx, sy, ghost, t);
    if (f.held.kind === "new") STATE.tents.pop();
    ctx.globalAlpha = 1;
  }
  const ok = !f.held || canPlace(f.held, f.cx, f.cy);
  const col = f.held ? (ok ? "#48d060" : "#e04848") : (movableAt(f.cx, f.cy) ? "#48d060" : C.white);
  const blink = Math.floor(t * 4) % 2 === 0;
  const W = w * TILE, H = h * TILE;
  px(ctx, C.ink, sx - 1, sy - 1, W + 2, 1); px(ctx, C.ink, sx - 1, sy + H, W + 2, 1); px(ctx, C.ink, sx - 1, sy, 1, H); px(ctx, C.ink, sx + W, sy, 1, H);
  if (blink || f.held) { px(ctx, col, sx, sy, W, 1); px(ctx, col, sx, sy + H - 1, W, 1); px(ctx, col, sx, sy, 1, H); px(ctx, col, sx + W - 1, sy, 1, H); }
  // Titel + Hilfe
  drawBox(4, 4, textWidth("EINRICHTEN") + 16, 20); drawText(ctx, "EINRICHTEN", 12, 10, C.uiBorder);
  const iy = sy + H / 2 > VIEW_H / 2 ? 28 : VIEW_H - 40;      // Hilfe-Box weicht dem Cursor aus
  drawBox(4, iy, VIEW_W - 8, 36);
  if (f.held) {
    drawText(ctx, f.held.name + (ok ? "" : " – geht hier nicht"), 12, iy + 7, ok ? C.uiText : C.redDk);
    drawText(ctx, "A: Abstellen · B: Abbrechen", 12, iy + 7 + LINE_H);
  } else {
    const o = movableAt(f.cx, f.cy);
    drawText(ctx, o ? (o.tent ? `Zelt ${STATE.tents.indexOf(o.tent) + 1}` : furnName(o)) : "Möbel auswählen", 12, iy + 7);
    drawText(ctx, o ? "A: Aufnehmen · B: Fertig" : "B: Fertig", 12, iy + 7 + LINE_H);
  }
}

/* ---------------------------- INNENRÄUME ----------------------------
   Schlichte, leere Räume. makeRoom() baut aus wenigen Angaben eine Map:
   Wände, Boden, Fenster und Ausgangstür unten in der Mitte.          */
function makeRoom(o) {
  const W = o.w, H = o.h, floor = o.floor || ".";
  const tiles = [], coll = [];
  const door = Math.floor(W / 2) - 1;
  for (let y = 0; y < H; y++) {
    let t = "", c = "";
    for (let x = 0; x < W; x++) {
      let ch;
      if (y === 0 || x === 0 || x === W - 1) ch = "T";
      else if (y === 1) ch = "F";
      else if (y === H - 1) ch = (x === door || (o.wideDoor && x === door + 1)) ? o.doorTile : "T";
      else ch = floor;
      t += ch; c += "TF".includes(ch) ? "#" : ".";
    }
    tiles.push(t); coll.push(c);
  }
  const objects = [
    { type: "trigger", x: door, y: H - 1, w: o.wideDoor ? 2 : 1, h: 1, interact: { kind: "warp", to: "outside", spawn: o.back, trigger: "touch", sound: "door" } },
    ...(o.objects || []),
  ];
  MAPS[o.id] = { name: o.name, tileset: "indoor", bg: C.black, tiles, collision: coll, objects, npcs: o.npcs || [],
    spawns: { entrance: { x: door, y: H - 2, dir: "up" } } };
}

/* ---------------------------- PFLANZEN DES BRUDERS ----------------------------
   40 Pflanzen in 4 Reihen, sofort erntereif, voll ausgestattet – ein Blick in
   die Zukunft. Sorte BROTHER_STRAIN (Stufe 5, legendär).                  */
// Feste Werte der Bruder-Zkittlez: 40 Pflanzen × 62,5 g × 50 €/g = 125.000 €
// (Fernando zahlt davon 80 % = genau 100.000 € für die Kaution)
const BROTHER_BUD = { grams: 62.5, perGram: 50, quality: 98, strength: 28 };
// Der Bruder hat Tier-5-Genetik im Grow-Raum (legendär)
const BROTHER_STRAIN = "runtzkotti";
const BROTHER_ROW_STRAINS = [BROTHER_STRAIN, BROTHER_STRAIN, BROTHER_STRAIN, BROTHER_STRAIN];
function brotherPlant(strain) {
  return { strain, rarity: 4, sex: "f", owner: "bruder", fixed: BROTHER_BUD, soil: "soil_coco", plantedAt: 0, last: Date.now(), growMs: STRAINS[strain].growMin * 60000, water: 100, wetMs: 1, dryMs: 0, fertVeg: "fert_pro", fertBloom: "fert_pro" };
}
const BROTHER = {
  rows: BROTHER_ROW_STRAINS.map((strain, i) => ({
    title: `Grow-Raum · Reihe ${i + 1}`, readonly: true, item: "tent_l",
    addons: { lamp: "lamp_pro", water: "auto_water", fan: "fan" },
    plants: Array.from({ length: 10 }, () => brotherPlant(strain)),
    onInspect(pl, tent) {
      const e = expectedBud(pl, tent);
      openDialog(`${STRAINS[pl.strain].name} · ${RARITIES[e.rarity].name} · Erntereif\n` +
        `Qualität ca. ${e.quality}\n` +
        `ca. ${e.grams.toFixed(1).replace(".", ",")} g · Wert ca. ${euro(e.value)}\n` +
        `Kokos · Profi-Dünger · Profi-LED · Auto-Bewässerung · Lüfter`);
    },
  })),
};
// Erwartete Werte einer Ernte ohne Zufall (für die Vorschau)
function expectedBud(pl, tent) {
  if (pl.fixed) return { quality: pl.fixed.quality, rarity: pl.rarity, strength: pl.fixed.strength, grams: pl.fixed.grams, value: pl.fixed.grams * pl.fixed.perGram };
  const s = STRAINS[pl.strain], soil = ITEMS[pl.soil];
  const fv = pl.fertVeg ? ITEMS[pl.fertVeg] : null, fb = pl.fertBloom ? ITEMS[pl.fertBloom] : null;
  const lamp = tentLamp(tent), fan = tentAddon(tent, "fan"), dry = plantDryShare(pl);
  const quality = Math.round(clamp(s.quality + soil.q + (fv ? fv.q : 0) + (fb ? fb.q : 0) + lamp.q + (fan ? fan.q : 0) - dry * 10 * DRY_Q_PER_10, 1, 100));
  const rarity = pl.rarity !== undefined ? pl.rarity : s.rarity;     // fest vorgegebene Seltenheit (Bruder)
  const strength = Math.round(s.strength * (0.8 + 0.4 * quality / 100) * 10) / 10;
  const grams = Math.round(s.yield * yieldWaterFactor(dry) * (fv ? fv.yieldM : 1) * (fb ? fb.yieldM : 1) * soil.yieldM * lamp.yieldM * 10) / 10;
  const value = Math.round(pricePerGram(pl.strain, quality) * grams * 100) / 100;
  return { quality, rarity, strength, grams, value };
}

function questStep(id) { return STATE.quests && STATE.quests[id] !== undefined ? STATE.quests[id] : -1; }
function setQuest(id, step, silent) {
  if (!STATE.quests) STATE.quests = {};
  STATE.quests[id] = step; saveGame();
  for (const k in MAP_CACHE) if (k !== GAME.mapId) delete MAP_CACHE[k];      // NPCs/Türen je nach Fortschritt
  if (!silent) { Sound.confirm(); showBanner(step >= QUESTS[id].steps.length - 1 ? "Quest erledigt!" : "Quest: " + QUESTS[id].title); }
}
function addMessage(from, text) {
  if (!STATE.messages) STATE.messages = [];
  STATE.messages.unshift({ from, text, at: Date.now(), read: false }); saveGame();
}

  const s = questStep("kaution");
  if (s !== 4) { openDialog(s >= 5 ? "Die Kaution für Ihren Bruder ist bereits hinterlegt." : "Polizei-Schalter. Bitte warten Sie, bis Sie aufgerufen werden."); return; }
  openDialog(`Sie möchten die Kaution für Ihren Bruder hinterlegen? Das macht ${euro(BAIL_AMOUNT)}.`, ["Bezahlen", "Abbrechen"], c => {
    if (c !== 0) return;
    if (STATE.money < BAIL_AMOUNT) { openDialog(`Tut mir leid, dafür reicht Ihr Geld nicht. Sie haben ${euro(STATE.money)}.`); return; }
    STATE.money -= BAIL_AMOUNT;
    openDialog("Die Kaution ist hinterlegt. Ihr Bruder wird sofort freigelassen.", null, () => {
      // Bruder erscheint neben dem Spieler
      const p = GAME.player, m = GAME.map;
      const spot = [[1, 0], [-1, 0], [0, 1]].map(([dx, dy]) => [p.x + dx, p.y + dy]).find(([x, y]) => !isBlocked(m, x, y));

      p.dir = spot[0] > p.x ? "right" : spot[0] < p.x ? "left" : "down";
      openDialog("Bruder: Mann, bin ich froh, dich zu sehen! Danke …\nBruder: Nicht hier. Triff mich in meiner Wohnung, dann erkläre ich dir alles.", null, () => {
        m.npcs = m.npcs.filter(n => n !== bro);
        setQuest("kaution", 5);
      });

};

/* ---------------------------- SMARTPHONE ---------------------------- */
function openPhone() {
  Sound.select();
  GAME.screen = { type: "phone", sel: 0, view: "home", update: updatePhone, render: renderPhone };
}
const PHONE_APPS = [{ id: "quests", label: "Quests" }, { id: "msgs", label: "Nachrichten" }];
function updatePhone() {
  const sc = GAME.screen;
  if (sc.view === "call") {
    if (Input.consume("a")) { const c = sc.call; GAME.screen = null; Sound.confirm(); openDialog(c.from + ": " + c.text, null, c.after); }
    Input.consume("b");
    return;
  }
  if (sc.view === "home") {
    if (Input.consume("up") || Input.consume("left")) { sc.sel = (sc.sel + PHONE_APPS.length - 1) % PHONE_APPS.length; Sound.select(); }
    if (Input.consume("down") || Input.consume("right")) { sc.sel = (sc.sel + 1) % PHONE_APPS.length; Sound.select(); }
    if (Input.consume("a")) {
      sc.view = PHONE_APPS[sc.sel].id; sc.scroll = 0; Sound.confirm();
      // Nachrichten öffnen = gelesen. Die neuen bleiben in dieser Ansicht noch markiert.
      if (sc.view === "msgs") { const m = STATE.messages || []; sc.fresh = m.filter(x => !x.read); m.forEach(x => x.read = true); saveGame(); }
    }
    else if (Input.consume("b") || Input.consume("start")) { GAME.screen = null; Sound.cancel(); }
  } else {
    if (Input.consume("up")) sc.scroll = Math.max(0, (sc.scroll || 0) - 1);
    if (Input.consume("down")) sc.scroll = (sc.scroll || 0) + 1;
    if (Input.consume("b") || Input.consume("a")) { sc.view = "home"; Sound.cancel(); }
    if (Input.consume("start")) { GAME.screen = null; }
  }
}
// Handy klingelt: Vollbild-Anruf, A = annehmen
function phoneCall(from, text, after) {
  GAME.screen = { type: "phone", view: "call", call: { from, text, after }, update: updatePhone, render: renderPhone, t0: GAME.time };
  ringtone();
}
function ringtone() { for (let i = 0; i < 3; i++) { Sound.tone(1320, 0.08, "square", 0.05, i * 0.5); Sound.tone(1760, 0.08, "square", 0.05, i * 0.5 + 0.1); Sound.tone(1320, 0.08, "square", 0.05, i * 0.5 + 0.2); } }

let PHONE_SCREEN = { sx: 0, sy: 0, sw: 0, sh: 0 };
function renderPhone() { _renderPhoneBase(); }
function _renderPhoneBase() {
  const sc = GAME.screen, t = GAME.time;
  ctx.globalAlpha = 0.6; px(ctx, C.black, 0, 0, VIEW_W, VIEW_H); ctx.globalAlpha = 1;
  const pw = Math.min(150, VIEW_W - 20), ph = VIEW_H - 16;
  const shake = sc.view === "call" && Math.floor(t * 12) % 2 ? 1 : 0;
  const x = Math.round((VIEW_W - pw) / 2) + shake, y = 8;
  // Gehäuse
  px(ctx, C.ink, x, y + 2, pw, ph - 4); px(ctx, C.ink, x + 2, y, pw - 4, ph);
  px(ctx, "#2a2a36", x + 2, y + 2, pw - 4, ph - 4);
  px(ctx, "#101018", x + pw / 2 - 10, y + 5, 20, 3);
  const sx = x + 6, sy = y + 12, sw = pw - 12, sh = ph - 28;
  px(ctx, "#e8f0f0", sx, sy, sw, sh);
  // Statusleiste
  px(ctx, "#2f7a45", sx, sy, sw, 12);
  const clock = typeof gameClock === "function" ? gameClock() : "";
  drawText(ctx, clock, sx + 4, sy + 2, C.white, null);
  const money = euro(STATE.money); drawText(ctx, money, sx + sw - 4 - textWidth(money), sy + 2, C.white, null);
  px(ctx, "#505060", x + pw / 2 - 8, y + ph - 10, 16, 4);
  PHONE_SCREEN = { sx, sy, sw, sh };
  if (sc.view === "_blank") return;

  if (sc.view === "call") {
    const c = sc.call;
    pixelCircle(ctx, sx + sw / 2, sy + 44, 16, "#9a58b8", C.ink);
    drawIcon(ctx, "house", sx + sw / 2 - 4, sy + 40, C.white);
    drawText(ctx, c.from, sx + Math.round((sw - textWidth(c.from)) / 2), sy + 68, C.uiText);
    const r = "ruft an" + ".".repeat(1 + Math.floor(t * 2) % 3);
    drawText(ctx, r, sx + Math.round((sw - textWidth("ruft an...")) / 2), sy + 82, "#707080", null);
    if (Math.floor(t * 3) % 2 === 0 && GAME.time - sc.t0 > 1.4) ringtone(), (sc.t0 = GAME.time);
    const bx = sx + sw / 2 - 26, by = sy + sh - 30;
    px(ctx, C.ink, bx, by, 52, 18); px(ctx, "#40b060", bx + 1, by + 1, 50, 16);
    drawText(ctx, (Input.touchUsed ? "A" : "ENTER") + ": Ran", bx + 26 - Math.round(textWidth((Input.touchUsed ? "A" : "ENTER") + ": Ran") / 2), by + 5, C.white, null);
    return;
  }
  if (sc.view === "home") {
    drawText(ctx, "Smartphone", sx + 6, sy + 16, C.uiText);
    PHONE_APPS.forEach((a, i) => {
      const step = PHONE_APPS.length > 3 ? 17 : 22, bh = step - 3, ay = sy + 28 + i * step, o = Math.floor((bh - 17) / 2);
      const sel = i === sc.sel;
      px(ctx, sel ? "#2f7a45" : C.ink, sx + 6, ay, sw - 12, bh); px(ctx, sel ? "#d8f0d8" : C.white, sx + 7, ay + 1, sw - 14, bh - 2);
      px(ctx, a.color || (a.id === "quests" ? C.yellow : a.id === "strains" ? C.leaf : "#4870c8"), sx + 10, ay + 3 + o, 9, 9); px(ctx, C.ink, sx + 10, ay + 3 + o, 9, 1);
      let badge = "";
      if (a.id === "quests") { const n = Object.keys(QUESTS).filter(q => questStep(q) >= 0 && questStep(q) < QUESTS[q].steps.length - 1).length; if (n) badge = String(n); }
      if (a.id === "msgs") { const n = (STATE.messages || []).filter(m => !m.read).length; if (n) badge = String(n); }
      if (a.id === "strains") badge = "";
      if (a.badge) { const n = a.badge(); if (n) badge = String(n); }
      const ty = ay + Math.floor((bh - 7) / 2);
      drawText(ctx, a.label, sx + 24, ty, C.uiText);
      if (a.id === "strains") { const c = (STATE.discovered || []).length + "/150"; drawText(ctx, c, sx + sw - 10 - textWidth(c), ty, "#2f7a45", null); }
      if (badge) { pixelCircle(ctx, sx + sw - 16, ty + 3, 5, C.red, C.ink); drawText(ctx, badge, sx + sw - 18, ty, C.white, null); }
    });
    drawText(ctx, "B: Schließen", sx + 6, sy + sh - 14, "#707080", null);
    return;
  }
  // Listen: Quests / Nachrichten
  const lines = [];
  if (sc.view === "quests") {
    drawText(ctx, "Quests", sx + 6, sy + 18, C.uiText);
    const ids = Object.keys(QUESTS).filter(q => questStep(q) >= 0);
    if (!ids.length) lines.push(["Keine Quests.", "#707080"]);
    for (const q of ids) {
      const st = questStep(q), done = st >= QUESTS[q].steps.length - 1;
      lines.push([(done ? "✓ " : "● ") + QUESTS[q].title, done ? "#3a9a50" : C.red]);
      for (const l of wrapText(QUESTS[q].steps[st], sw - 16)) lines.push([l, C.uiText]);
      lines.push(["", C.uiText]);
    }
  } else {
    drawText(ctx, "Nachrichten", sx + 6, sy + 18, C.uiText);
    const msgs = STATE.messages || [];
    if (!msgs.length) lines.push(["Keine Nachrichten.", "#707080"]);
    for (const m of msgs) { const neu = (sc.fresh || []).includes(m); lines.push([(neu ? "● " : "") + m.from, neu ? C.red : "#2f7a45"]); for (const l of wrapText(m.text, sw - 16)) lines.push([l, C.uiText]); lines.push(["", C.uiText]); }
  }
  const maxL = Math.floor((sh - 48) / 11);
  sc.scroll = Math.min(sc.scroll || 0, Math.max(0, lines.length - maxL));
  lines.slice(sc.scroll, sc.scroll + maxL).forEach(([l, col], i) => drawText(ctx, l, sx + 8, sy + 32 + i * 11, col, null));
  drawText(ctx, "B: Zurück", sx + 6, sy + sh - 14, "#707080", null);
}

   sobald der Übergang (Fade) fertig ist.                               */
const _placePlayer = placePlayer;
placePlayer = function (mapId, spawn) {
  const from = GAME.mapId;
  _placePlayer(mapId, spawn);
  if (!STATE) return;
  const s = questStep("kaution");
  // 1) Erstes Verlassen der eigenen Wohnung -> Mama ruft an
  if (from === "apartment" && mapId !== "apartment" && s < 0) {
    setQuest("kaution", 0, true);
    GAME.pendingEvent = () => setTimeout(() => phoneCall("Mama",
      "Hallo, mein Schatz … Du musst sofort zu mir kommen! Es ist etwas Furchtbares passiert. Ich erkläre dir alles, wenn du hier bist. Bitte beeil dich!",
      () => { addMessage("Mama", "Komm bitte sofort vorbei! Gelbes Haus, unten rechts in der Stadt."); showBanner("Quest: Die Kaution");
        openDialog("Info: Deine Quests findest du jederzeit über START → Smartphone → Quests."); }), 400);
  }
  // 2) Erstes Betreten der Bruder-Wohnung
  if (mapId === "brother_down" && s === 1) GAME.pendingEvent = () => openDialog("Die Wohnung deines Bruders … Von hier unten führt eine Treppe nach oben.");
  // 3) Erstes Betreten des Grow-Raums -> Idee mit den Zkittlez
  if (mapId === "brother_up" && s === 1) {

/* =====================================================================
   20. FERNANDO – DER LÄUFER (rotes Haus oben rechts)
   Nimmt ab RUNNER_MIN_GRAMS Blüten an. Nach einer Wartezeit (je nach
   Menge) schickt er eine SMS, dann holt man das Geld bei ihm ab.
   Auszahlung = Wert der Blüten minus RUNNER_CUT (20 %).
   Mehrere Aufträge sind möglich, laufen aber NACHEINANDER ab.
   Jeder Auftrag merkt sich seinen Läufer (runner: "fernando") – so können
   später weitere Läufer dazukommen.
   ===================================================================== */
const RUNNER_MIN_GRAMS = 100;
const RUNNER_CUT = 0.20;
const RUNNER_MIN_PER_10G = 1;       // Wartezeit: 1 Minute pro 10 g …
const RUNNER_MAX_MIN = 60;          // … höchstens 60 Minuten (Echtzeit)

const fmtG = g => { const [i, d] = g.toFixed(1).split("."); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ".") + "," + d + " g"; };   // 2.500,0 g
function runnerJobs() { if (!STATE.runner) STATE.runner = []; return STATE.runner; }
function checkRunner() {
  if (!STATE) return;
  for (const j of runnerJobs()) if (!j.notified && Date.now() >= j.readyAt) {

    addMessage("Fernando", `Deine ${fmtG(j.grams)} sind weg. Dein Geld (${euro(j.payout)}) liegt bereit. Komm vorbei.`);
    Sound.tone(1568, 0.07, "square", 0.05); Sound.tone(2093, 0.1, "square", 0.05, 0.09);
    if (!GAME.dialog && !GAME.screen) showBanner("Neue SMS: Fernando");
  }
}

TALKS.fernando = () => {
  if (questStep("kaution") < 7) { openDialog("Fernando: Kümmer dich erst um deinen Bruder."); return; }

  const items = [{ label: "Blüten abgeben", id: "give" }];
  if (ready.length) items.unshift({ label: "Geld abholen", right: euro(ready.reduce((n, j) => n + j.payout, 0)), id: "collect" });

      ? `\nFernando: Ich bin noch mit deiner Ware unterwegs. Noch ca. ${next} min.`
      : `\nFernando: Ich hab noch ${open.length} Aufträge von dir. Die mache ich nacheinander – der nächste ist in ca. ${next} min fertig.`;
  }
  openDialog(greet, null, () => openMenu({
    title: "FERNANDO", items,
    onChoose(it) {
      if (it.id === "collect") {
        const sum = ready.reduce((n, j) => n + j.payout, 0);

        STATE.money += sum; saveGame(); Sound.floor();
        openDialog(`Fernando: Hier, wie abgemacht. ${euro(sum)}.`);

};

// Blüten auswählen (A = an/abwählen), dann "Abgeben"
function openRunnerGive() {
  const own = STATE.buds.filter(b => !b.owner);
  if (!own.length) { openDialog("Fernando: Du hast ja gar nichts dabei."); return; }
  const picked = new Set();
  const build = () => {
    const g = own.filter(b => picked.has(b.id)).reduce((n, b) => n + b.grams, 0);
    const v = own.filter(b => picked.has(b.id)).reduce((n, b) => n + b.value, 0);
    return [
      { label: `Abgeben: ${fmtG(g)}`, right: euro(v * (1 - RUNNER_CUT)), id: "go", g, v },
      { label: "Alle auswählen", id: "all" },
      ...own.map(b => ({ label: (picked.has(b.id) ? "✓ " : "  ") + STRAINS[b.strain].name, right: fmtG(b.grams), color: RARITIES[b.rarity].color, bud: b })),
    ];
  };
  openMenu({
    title: "BLÜTEN ABGEBEN", stay: true, items: build(),
    footer: () => `Ab ${RUNNER_MIN_GRAMS} g · abzüglich ${Math.round(RUNNER_CUT * 100)} %`,
    onChoose(it) {
      const m = GAME.menus[GAME.menus.length - 1];
      if (it.bud) { picked.has(it.bud.id) ? picked.delete(it.bud.id) : picked.add(it.bud.id); }
      else if (it.id === "all") { const allOn = own.every(b => picked.has(b.id)); own.forEach(b => allOn ? picked.delete(b.id) : picked.add(b.id)); }
      else if (it.id === "go") {
        if (it.g < RUNNER_MIN_GRAMS) { Sound.bump(); openDialog(`Fernando: Unter ${RUNNER_MIN_GRAMS} g lohnt sich das nicht für mich. Du hast ${fmtG(it.g)} ausgewählt.`); return; }
        const payout = Math.round(it.v * (1 - RUNNER_CUT) * negoFactor() * 100) / 100;
        const mins = Math.min(RUNNER_MAX_MIN, Math.max(1, Math.ceil(it.g / 10) * RUNNER_MIN_PER_10G));
        // Aufträge laufen NACHEINANDER: der neue startet, wenn der letzte fertig ist
        const start = Math.max(Date.now(), ...runnerJobs().filter(j => j.runner === "fernando").map(j => j.readyAt));
        const waitMin = Math.ceil((start - Date.now()) / 60000), total = waitMin + mins;
        const queueTxt = waitMin > 0 ? `\nFernando: Ich hab noch einen Auftrag von dir. Der kommt danach dran – also ca. ${total} Minuten.` : `\nFernando: Gib mir ca. ${mins} Minuten.`;
        openDialog(`Fernando: ${fmtG(it.g)} … Das bringt ${euro(it.v)}, abzüglich meiner ${Math.round(RUNNER_CUT * 100)} % bleiben ${euro(payout)} für dich.${queueTxt} Ich melde mich per SMS.`, ["Abgeben", "Abbrechen"], c => {
          if (c !== 0) return;
          STATE.buds = STATE.buds.filter(b => !picked.has(b.id));
          runnerJobs().push({ runner: "fernando", grams: it.g, payout, startAt: start, readyAt: start + mins * 60000, notified: false });
          saveGame(); Sound.confirm(); closeMenu();
          openDialog(`Du hast ${fmtG(it.g)} an Fernando abgegeben.`);
        });
        return;
      }
      m.items = build(); Sound.select();
    },
  });
}

/* =====================================================================
   23. TAG/NACHT, SCHLAFEN, BLÜTEN-TASCHE UND SCHRANK
   ---------------------------------------------------------------------
   Spieluhr: 1 Spielstunde = 1 echte Minute (1 Tag = 24 min Echtzeit).
   Nachts wird es dunkler. Schlafen im eigenen Bett ist ab 20:00 (bis
   vor 8:00) möglich und springt auf 8:00. Die Pflanzen wachsen die
   übersprungene Zeit mit – ohne Wassermangel – und haben danach Durst.

   Blüten: gleiche Sorte + gleiche Qualität stapeln sich.
   Tasche max. BAG_MAX_G, Schrank zu Hause max. STASH_MAX_G.
   ===================================================================== */
const GAME_MIN_PER_REAL_SEC = 1;             // 1 Spielminute pro echter Sekunde
const SLEEP_FROM = 20, WAKE_AT = 8;          // Schlafen ab 20:00, Aufwachen 8:00
const BAG_MAX_G = 5000, STASH_MAX_G = 10000;

/* ---------------------------- UHR ---------------------------- */
// Spielminute des Tages (0 … 1439)
function gameMinuteOfDay() {
  const off = (STATE && STATE.clockOffset) || 0;
  return Math.floor(((Date.now() / 1000) * GAME_MIN_PER_REAL_SEC + off) % 1440 + 1440) % 1440;
}
function gameClock() { const m = gameMinuteOfDay(); return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); }
function isNight() { const h = gameMinuteOfDay() / 60; return h >= SLEEP_FROM || h < WAKE_AT; }
// Neues Spiel startet morgens um 8:00
const _newStateT = newState;
newState = function () { const s = _newStateT(); s.clockOffset = 0; s.clockOffset = (WAKE_AT * 60) - ((Date.now() / 1000) * GAME_MIN_PER_REAL_SEC) % 1440; return s; };

// Dunkelheit: 18–20 Uhr dämmert es, 20–5 Nacht, 5–7 Morgengrauen
function darkness() {
  const h = gameMinuteOfDay() / 60;
  if (h >= 20 || h < 5) return 1;
  if (h >= 18) return (h - 18) / 2;
  if (h < 7) return 1 - (h - 5) / 2;
  return 0;
}
const _renderWorldT = renderWorld;
renderWorld = function () {
  _renderWorldT();
  const d = darkness();
  if (d > 0) {
    const outdoor = GAME.map.def.tileset === "outdoor";
    ctx.globalAlpha = d * (outdoor ? 0.5 : 0);     // drinnen ist abends das Licht an
    px(ctx, "#101838", 0, 0, VIEW_W, VIEW_H);
    ctx.globalAlpha = 1;
  }
};
// kleine Uhr oben rechts (nur beim Laufen)
const _renderUIT = renderUI;
renderUI = function () {
  _renderUIT();
  if (currentMode() !== "play") return;
  const t = gameClock(), w = textWidth(t) + 12;
  drawBox(VIEW_W - w - 4, 4, w, 17);
  drawText(ctx, t, VIEW_W - w + 2, 9, isNight() ? "#384870" : C.uiText);
};

CUSTOM_INTERACTIONS.sleep = () => {
  if (!isNight()) { Sound.select(); openDialog(`Du bist noch nicht müde. Es ist ${gameClock()} Uhr.\nSchlafen kannst du ab ${SLEEP_FROM}:00 Uhr.`); return; }
  openDialog(`Es ist ${gameClock()} Uhr. Schlafen bis ${WAKE_AT}:00 Uhr?`, ["Schlafen", "Abbrechen"], c => { if (c === 0) sleepUntilMorning(); });
};
function sleepUntilMorning() {
  const now = gameMinuteOfDay();
  const skipMin = ((WAKE_AT * 60 - now) + 1440) % 1440;                  // Spielminuten bis 8:00
  const skipMs = skipMin / GAME_MIN_PER_REAL_SEC * 1000;                    // entspricht so viel Echtzeit
  GAME.fade = { t: 0, phase: "out", dur: 0.6, hold: 1.2, mapId: GAME.mapId, spawn: null, keepPos: true,
    after: () => {
      simulateTent();
      // Pflanzen wachsen die Nacht mit – ohne Wassermangel – und sind danach durstig
      for (const tent of STATE.tents) for (const pl of tent.plants) if (pl) {
        const total = plantTotalMs(pl), speed = plantSpeed(pl, tent);
        const used = Math.min(skipMs, Math.max(0, (total - pl.growMs) / speed));
        pl.growMs = Math.min(total, pl.growMs + used * speed);
        pl.wetMs += used;
        if (!tentAddon(tent, "water")) pl.water = 0;
      }
      // Fernando arbeitet nachts weiter
      for (const j of (STATE.runner || [])) { j.readyAt -= skipMs; if (j.startAt) j.startAt -= skipMs; }
      STATE.clockOffset = (STATE.clockOffset || 0) + skipMin;
      saveGame();
      checkRunner();
      think("Guten Morgen! Es ist 8:00 Uhr.\nDeine Pflanzen sind über Nacht gewachsen – und haben Durst.");
    } };
  Sound.tone(392, 0.5, "sine", 0.05); Sound.tone(330, 0.7, "sine", 0.05, 0.4);
}
// Übergang ohne Kartenwechsel (Position bleibt)

/* ---------------------------- BLÜTEN: STAPELN, TASCHE, SCHRANK ---------------------------- */
// Ist diese Karte ein eigenes Zuhause? (wird in 20_realestate.js für alle Immobilien erweitert)
function isHomeMap(id) { return id === "apartment"; }
const budKey = b => b.strain + "|" + b.quality + "|" + (b.owner || "");
const sumG = list => list.reduce((s, b) => s + b.grams, 0);
function stash() { if (!STATE.stash) STATE.stash = []; return STATE.stash; }
const bagFree = () => Math.max(0, BAG_MAX_G - sumG(STATE.buds));
function stashMax() { return STASH_MAX_G; }          // wird durch Schränke aus dem Möbelhaus erweitert
const stashFree = () => Math.max(0, stashMax() - sumG(stash()));
// Menge einer Blüte in eine Liste legen (stapelt automatisch)
function addToList(list, bud, grams) {
  if (grams <= 0) return;
  const perG = bud.value / bud.grams;
  const s = list.find(x => budKey(x) === budKey(bud));
  if (s) {
    s.strength = Math.round((s.strength * s.grams + bud.strength * grams) / (s.grams + grams) * 10) / 10;
    if (s.thc != null && bud.thc != null) s.thc = Math.round((s.thc * s.grams + bud.thc * grams) / (s.grams + grams) * 10) / 10;
    if (s.terp != null && bud.terp != null) s.terp = Math.round((s.terp * s.grams + bud.terp * grams) / (s.grams + grams) * 100) / 100;
    s.grams = Math.round((s.grams + grams) * 10) / 10;
    s.value = Math.round((s.value + perG * grams) * 100) / 100;
  } else list.push({ ...bud, id: STATE.nextBudId++, grams: Math.round(grams * 10) / 10, value: Math.round(perG * grams * 100) / 100 });
}
function takeFromList(list, stack, grams) {
  const perG = stack.value / stack.grams;
  const part = { ...stack, grams, value: Math.round(perG * grams * 100) / 100 };
  stack.grams = Math.round((stack.grams - grams) * 10) / 10;
  stack.value = Math.round((stack.value - part.value) * 100) / 100;
  if (stack.grams <= 0.05) list.splice(list.indexOf(stack), 1);
  return part;
}
function normalizeBuds() {
  const bag = STATE.buds; STATE.buds = []; for (const b of bag) addToList(STATE.buds, b, b.grams);
  const st = stash().slice(); STATE.stash = []; for (const b of st) addToList(STATE.stash, b, b.grams);
}
// Ernte: erst Tasche, Rest in den Schrank (nur zu Hause). Passt nichts -> Ernte gesperrt.
const _harvestBudT = harvestBud;
harvestBud = function (tent, slot) {
  const pl = tent.plants[slot];
  const bud = _harvestBudT(tent, slot);
  STATE.buds.splice(STATE.buds.indexOf(bud), 1);               // frisch geerntet -> gleich einsortieren
  const home = isHomeMap(GAME.mapId);
  const room = bagFree() + (home ? stashFree() : 0);
  if (bud.grams > room) {                                         // passt nicht -> rückgängig
    tent.plants[slot] = pl; saveGame();
    throw { bagFull: true, grams: bud.grams };
  }
  const toBag = Math.min(bud.grams, bagFree());
  addToList(STATE.buds, bud, toBag);
  const rest = Math.round((bud.grams - toBag) * 10) / 10;
  if (rest > 0) { addToList(stash(), bud, rest); bud.toStash = rest; }
  saveGame();
  return bud;
};
// Fehlermeldung, wenn die Tasche voll ist
const _harvestPlantT = harvestPlant;
harvestPlant = function (tent, slot) {
  try { return _harvestPlantT(tent, slot); }
  catch (e) { if (e && e.bagFull) return { full: true, grams: e.grams }; throw e; }
};
const _harvestTextT = harvestText;
harvestText = function (res) {
  if (res.full) return `Deine Tasche ist voll (${fmtKg(sumG(STATE.buds))} von ${fmtKg(BAG_MAX_G)}).` +
    (isHomeMap(GAME.mapId) ? " Auch im Schrank ist kein Platz mehr." : " Bring Blüten in deinen Schrank zu Hause.");
  let t = _harvestTextT(res);
  if (res.bud && res.bud.toStash) { t += `\nInventar voll – Ernte liegt im Schrank (${fmtG(res.bud.toStash)}).`; showBanner("Inventar voll – Ernte im Schrank"); }
  return t;
};
const fmtKg = g => (g / 1000).toFixed(2).replace(".", ",") + " kg";

/* ---------- Tasche: Blüten gehören jetzt in die Tasche ---------- */
function budLabel(b) { return STRAINS[b.strain].name + " Q" + b.quality; }
openBagMenu = function () {

};

};

const _openMainMenuT = openMainMenu;

/* ---------- Schrank: Blüten ein- und auslagern ---------- */
CUSTOM_INTERACTIONS.stash = () => {

function moveMenu(from, to, freeFn, title) {
  const build = () => [{ label: "Alles", id: "all" }, ...from.map(b => ({ label: budLabel(b), right: fmtG(b.grams), color: RARITIES[b.rarity].color, bud: b }))];
  openMenu({

      if (moved > 0) Sound.confirm();
      openDialog(moved > 0 ? `${fmtG(moved)} verschoben.` : (from === STATE.buds ? "Der Schrank ist voll." : "Deine Tasche ist voll."));
    },
  });
}

const stefOrderNo = () => 3 + (STATE.stefOrders || []).length;          // Nummer des NÄCHSTEN Auftrags

function stefPick() {

  if (questStep("stefanie2") === 0) return { strain: STEF_STRAIN2, quest: "stefanie2" };

function stefCheck() {
  if (!STATE || questStep("stefanie") < 1 || stefWish()) return;          // erst nach Auftrag 1, nie zwei Wünsche gleichzeitig

  stefSms(`Hey Nachbar! Ich hab wieder Lust auf was Neues: ${STRAINS[id].name}${par ? " (" + par + ")" : ""}. Wieder das Dreifache – egal wie viel. Bring sie einfach rüber!`);

  const W = STRAINS[wish.strain].name;

  if (!stacks.length) {

  const seen = new Set([p.x + "," + p.y]), queue = [[p.x, p.y]];

    for (const [dx, dy] of Object.values(DIRS)) {
      const nx = qx + dx, ny = qy + dy, k = nx + "," + ny;

function street() {

  for (const p of STREET_PEOPLE) if (!STATE.street[p.id]) STATE.street[p.id] = { met: false, order: null, nextAt: 0, done: 0 };

}
const streetOpen = () => STREET_PEOPLE.filter(p => street()[p.id].order);

const nowMin = () => gameMinutesTotal();
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

// Wo steht ein Kunde gerade? (vor dem Kennenlernen: Startplatz, danach: Ort des Auftrags)
function streetSpotOf(p) {
  const st = street()[p.id];
  if (!st.met) return STREET_SPOTS[p.start];
  if (!st.order) return null;
  return st.order.spot === "home" ? homeDoorSpot() : STREET_SPOTS[st.order.spot];
}

/* ---------------------------- AUFTRÄGE ---------------------------- */
function freeSpot(exclude) {
  const used = new Set(streetOpen().map(p => street()[p.id].order.spot));
  const list = Object.keys(STREET_SPOTS).filter(k => !used.has(k) && k !== exclude);
  return pick(list.length ? list : Object.keys(STREET_SPOTS));
}
// Nur Sorten, die man selbst schon angebaut hat (Haken in der Sortenliste)
function streetLog(text) { (STATE.streetLog = STATE.streetLog || []).unshift(text); STATE.streetLog.length = Math.min(STATE.streetLog.length, 5); }
function wantStrain() {
  const list = (STATE.grown || []).filter(k => STRAINS[k]);
  return pick(list.length ? list : ["afghani"]);
}
// Episches wird erst verlangt, wenn man selbst schon eine epische (oder bessere) Sorte angebaut hat
const epicUnlocked = () => (STATE.grown || []).some(k => STRAINS[k] && STRAINS[k].rarity >= 3);
const rarityAcc = r => ({ Ungewöhnlich: "Ungewöhnliches", Selten: "Seltenes", Episch: "Episches", Legendär: "Legendäres" })[RARITIES[r].name] || RARITIES[r].name;
function makeOrder(p) {
  const tier = rint(1, 4), t = nowMin();
  const o = { tier, factor: STREET_TIERS[tier], created: t };
  if (tier === 1) Object.assign(o, { grams: 20, spot: freeSpot(), until: t + STREET_DAY });
  else if (tier === 2) {
    if (Math.random() < 0.5 && !streetOpen().some(q => street()[q.id].order.spot === "home"))
      Object.assign(o, { grams: 10, spot: "home", until: t + 120, rush: true });
    else Object.assign(o, { grams: 20, minRarity: 1, spot: freeSpot(), until: t + STREET_DAY });
  } else if (tier === 3) Object.assign(o, { grams: 20, strain: wantStrain(), spot: freeSpot(), until: t + STREET_DAY });
  else {
    if (Math.random() < 0.5) Object.assign(o, { grams: 10, strain: wantStrain(), spot: freeSpot(), until: t + 120, rush: true });
    else Object.assign(o, { grams: 30, minRarity: epicUnlocked() ? 3 : 2, spot: freeSpot(), until: t + 180, rush: true });
  }
  return o;
}
const clockAt = min => { const m = ((Math.floor(min) % 1440) + 1440) % 1440; return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0"); };
function orderWhat(o) {
  if (o.strain) return `${o.grams} g ${STRAINS[o.strain].name}`;
  if (o.minRarity) return `${o.grams} g, mindestens ${rarityAcc(o.minRarity)}`;
  return `${o.grams} g`;
}
function orderPlace(o) { return (o.spot === "home" ? homeDoorSpot() : STREET_SPOTS[o.spot]).text; }
function orderSms(o) {
  const place = orderPlace(o), until = ` (bis ${clockAt(o.until)} Uhr)`;
  if (o.tier === 1) return `Hey bro, ich brauche ${o.grams} g und stehe ${place}.`;
  if (o.tier === 2 && o.rush) return `Ich brauche schnellstmöglich ${o.grams} g! Ich stehe ${place}.${until}`;
  if (o.tier === 2) return `Ich brauche etwas Besseres als das Standard-Zeug (mind. Ungewöhnlich). ${o.grams} g – ich stehe ${place}.`;
  if (o.tier === 3) return `Ich brauche ${STRAINS[o.strain].name}, ${o.grams} g. Du findest mich ${place}.`;
  if (o.strain) return `Ich brauche schnellstmöglich ${STRAINS[o.strain].name}! ${o.grams} g – ich stehe ${place}.${until}`;
  return `Ich brauche schnellstmöglich ${o.grams} g, mindestens ${rarityAcc(o.minRarity)}! Ich stehe ${place}.${until}`;
}
function smsPing(from) { Sound.tone(1568, 0.07, "square", 0.05); Sound.tone(2093, 0.1, "square", 0.05, 0.09); if (!GAME.dialog && !GAME.screen) showBanner("Neue SMS: " + from); }
function refreshStreetMaps() {
  for (const k in MAP_CACHE) if (k !== GAME.mapId) delete MAP_CACHE[k];
  if (GAME.map && !GAME.fade) {
    GAME.map.npcs = GAME.map.npcs.filter(n => !n.street);
    GAME.map.npcs.push(...streetNpcsFor(GAME.mapId));
  }
}
function streetCheck() {
  if (!STATE || !streetActive()) return;
  const t = nowMin();
  let changed = false;
  for (const p of STREET_PEOPLE) {
    const st = street()[p.id];
    if (!st.met) continue;
    if (st.order && t > st.order.until) {                     // abgelaufen
      addMessage(p.name, st.order.rush ? "Zu spät, bro. Hab's mir woanders geholt." : "Hat sich erledigt, hab's woanders bekommen.");
      smsPing(p.name);
      streetLog(`✗ ${p.name}: ${orderWhat(st.order)} – abgelaufen`);
      st.order = null; st.nextAt = t + rint(...STREET_GAP); changed = true;
    }
    if (!st.order && t >= st.nextAt && !GAME.fade) {
      st.order = makeOrder(p);
      addMessage(p.name, orderSms(st.order));
      smsPing(p.name); changed = true;
    }
  }
  if (changed) { saveGame(); refreshStreetMaps(); }
}

for (const p of STREET_PEOPLE) TALKS["street_" + p.id] = () => talkStreet(p);
function talkStreet(p) {
  const st = street()[p.id];
  if (!st.met) {
    openDialog(`???: Hey, du! Ja, du. Man hört, du hast gutes Zeug.\n${p.name}: ${p.hello}\n${p.name}: Hier, meine Nummer. Ich meld mich per SMS, wenn ich was brauche – und dann steh ich da, wo ich's dir schreibe.`, null, () => {
      st.met = true; st.nextAt = nowMin() + rint(...STREET_GAP); saveGame();
      showBanner("Neuer Kontakt: " + p.name);
      refreshStreetMaps();
      if (STREET_PEOPLE.filter(q => street()[q.id].met).length === 1)
        think("Du denkst: Wenn er mir schreibt, steht im Smartphone unter „Aufträge“, was er will und wo er steht.");
    });
    return;
  }
  const o = st.order;
  if (!o) { openDialog(`${p.name}: Gerade brauch ich nichts. Ich schreib dir.`); return; }
  const need = orderWhat(o);
  const fits = b => !b.owner && (!o.strain || b.strain === o.strain) && (!o.minRarity || b.rarity >= o.minRarity);
  const have = sumG(STATE.buds.filter(fits));
  if (have + 1e-9 < o.grams) {
    openDialog(`${p.name}: Hast du's? Ich brauche ${need}.` + (have > 0 ? `\nDu hast nur ${fmtG(have)} Passendes dabei.` : "\nDu hast nichts Passendes in deiner Tasche."));
    return;
  }
  openDialog(`${p.name}: Da bist du ja! Ich brauche ${need}. Ich zahle ${Math.round(o.factor * 100)} % vom Wert.`, ["Verkaufen", "Später"], c => {
    if (c === 0) chooseStreetBuds(p, o, fits, o.grams);
  });
}
// Blüten auswählen, bis die Menge erreicht ist (Abbrechen = alles zurück in die Tasche)
function chooseStreetBuds(p, o, fits, left, parts) {
  parts = parts || [];
  const list = STATE.buds.filter(fits);
  openMenu({
    title: `NOCH ${fmtG(left).toUpperCase()}`,
    items: list.map(b => ({ label: STRAINS[b.strain].name + " Q" + b.quality, right: fmtG(b.grams), color: RARITIES[b.rarity].color, bud: b })),
    onCancel: () => { for (const part of parts) addToList(STATE.buds, part, part.grams); normalizeBuds(); saveGame(); },
    onChoose(it) {
      const g = Math.round(Math.min(left, it.bud.grams) * 10) / 10;
      const part = takeFromList(STATE.buds, it.bud, g);
      parts.push(part);
      const nl = Math.round((left - part.grams) * 10) / 10;
      if (nl > 0.05) chooseStreetBuds(p, o, fits, nl, parts);
      else finishStreet(p, o, parts);
    },
  });
}
function finishStreet(p, o, parts) {
  const st = street()[p.id];
  const grams = Math.round(parts.reduce((n, b) => n + b.grams, 0) * 10) / 10, value = parts.reduce((n, b) => n + b.value, 0);
  const pay = Math.round(value * o.factor * negoFactor() * 100) / 100;
  STATE.money += pay;
  streetLog(`✓ ${p.name}: ${fmtG(grams)} · ${euro(pay)}`);
  st.order = null; st.done++; st.nextAt = nowMin() + rint(...STREET_GAP);
  saveGame(); Sound.floor();
  refreshStreetMaps();
  openDialog(`Du hast ${fmtG(grams)} an ${p.name} verkauft: ${euro(pay)} (${Math.round(o.factor * 100)} % von ${euro(Math.round(value * 100) / 100)}).\n${p.name}: Top, bro! Ich meld mich wieder.`);
}

/* =====================================================================
   29. CLOUD-SPIELSTAND – über dein Claude-Konto
   ---------------------------------------------------------------------
   Der Spielstand liegt zusätzlich zum Browser-Speicher in der Datenbank
   des veröffentlichten Spiels, im privaten Bereich des angemeldeten
   Spielers (data/users/<id>/save). Kein eigenes Login nötig: wer das Spiel
   in Claude öffnet, ist schon angemeldet.
   Beim Start: ist der Cloud-Stand neuer (oder der Browser-Speicher leer),
   wird er übernommen. Danach wird alle 20 Sekunden hochgeladen, wenn sich
   etwas geändert hat, und beim Verlassen der Seite.
   Ohne Cloud (z. B. als heruntergeladene HTML-Datei) läuft alles wie bisher.
   ===================================================================== */
const CLOUD = { db: null, ref: null, ready: false, dirty: false, busy: false, last: "", status: "aus", lastOk: 0 };
function cloudMarkDirty() { CLOUD.dirty = true; }
// Spielfortschritt als Zahl – schützt davor, einen weiter fortgeschrittenen Stand mit einem neuen Spiel zu überschreiben
function saveProgress(st) {
  if (!st) return 0;
  const q = Object.values(st.quests || {}).reduce((n, v) => n + (v + 1), 0);
  return q * 1000 + (st.grown || []).length * 10 + (st.discovered || []).length + ((st.props && st.props.owned) || []).length * 100;
}
const progressOfRaw = raw => { try { return saveProgress(JSON.parse(raw)); } catch (e) { return 0; } };
const HAD_LOCAL_SAVE = (() => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } })();

async function cloudPush() {
  if (!CLOUD.ready || CLOUD.busy || !CLOUD.dirty || !STATE) return;
  const raw = JSON.stringify(STATE);
  if (raw === CLOUD.last) { CLOUD.dirty = false; return; }
  CLOUD.busy = true; CLOUD.dirty = false;
  try {
    // Sicherung: höchstens alle 30 min den vorherigen Stand als Backup ablegen
    if (CLOUD.last && Date.now() - (CLOUD.backupAt || 0) > 30 * 60000) {
      await CLOUD.backupRef.set({ savedAt: Date.now(), data: CLOUD.last }).catch(() => { });
      CLOUD.backupAt = Date.now();
    }
    await CLOUD.ref.set({ savedAt: STATE.savedAt || Date.now(), data: raw });
    CLOUD.last = raw; CLOUD.status = "ok"; CLOUD.lastOk = Date.now();
  } catch (e) {
    CLOUD.dirty = true;
    CLOUD.status = "fehler"; CLOUD.why = (e && (e.code || e.message)) || "Fehler";
  }
  CLOUD.busy = false;
}
// Cloud-Stand ins laufende Spiel übernehmen (wie beim Start)
function applyCloudSave(raw) {
  GAME.cloudRaw = raw;
  loadGame();
  GAME.cloudRaw = null;
  try { localStorage.setItem(SAVE_KEY, raw); } catch (e) { }
  for (const k in MAP_CACHE) delete MAP_CACHE[k];
  GAME.dialog = null; GAME.menus.length = 0; GAME.screen = null; GAME.thoughts = [];
  const pos = STATE.pos;
  const posOk = pos && MAPS[pos.map] && !isBlocked(getMap(pos.map), pos.x, pos.y);
  if (posOk) { placePlayer(pos.map, null); Object.assign(GAME.player, { x: pos.x, y: pos.y, dir: pos.dir || "down" }); updateCamera(); }
  else placePlayer(START.map, START.spawn);
  simulateTent();
  setTimeout(() => showBanner("Spielstand aus der Cloud geladen"), 900);
}
async function cloudStart() {
  // Manche Ansichten (z. B. Handy-App) stellen window.claude erst etwas später bereit → bis zu 20 s warten
  for (let i = 0; i < 40 && !(window.claude && typeof window.claude.use === "function"); i++) await new Promise(r => setTimeout(r, 500));
  if (!(window.claude && typeof window.claude.use === "function")) { CLOUD.status = "aus"; CLOUD.why = "keine Claude-Verbindung"; return; }
  try {
    let db = null, user = null;
    for (let i = 0; i < 3 && (!db || !user); i++) [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) { CLOUD.status = "aus"; CLOUD.why = "Datenbank hier nicht verfügbar"; return; }
    const uid = await user.id();
    if (!uid) { CLOUD.status = "aus"; CLOUD.why = "nicht angemeldet"; return; }
    CLOUD.db = db; CLOUD.ref = db.doc("data/users/" + uid + "/save"); CLOUD.backupRef = db.doc("data/users/" + uid + "/save_backup");
    const snap = await CLOUD.ref.get();
    const cloud = snap.exists ? snap.data() : null;
    const localAt = (STATE && STATE.savedAt) || 0;
    // Cloud übernehmen, wenn kein lokaler Stand da ist, der Cloud-Stand neuer ist ODER mehr Fortschritt hat
    if (cloud && typeof cloud.data === "string" && (!HAD_LOCAL_SAVE || (cloud.savedAt || 0) > localAt || progressOfRaw(cloud.data) > saveProgress(STATE))) {
      applyCloudSave(cloud.data);
      CLOUD.last = cloud.data;
    }
    CLOUD.ready = true; CLOUD.status = "ok"; CLOUD.why = "";
    CLOUD.dirty = true;
    cloudPush();
  } catch (e) { CLOUD.status = "fehler"; CLOUD.why = (e && (e.code || e.message)) || "Fehler"; setTimeout(cloudStart, 30000); }
}
setTimeout(cloudStart, 0);
setInterval(cloudPush, 20000);
window.addEventListener("pagehide", () => { CLOUD.dirty = true; cloudPush(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { CLOUD.dirty = true; cloudPush(); } });

    CLOUD.dirty = true;

};

/* ---------------------------- SPIELSTAND-CODE (Export/Import) ----------------------------
   Sicherung zum Kopieren: der ganze Spielstand als Text. Funktioniert überall
   (auch ohne Cloud). Einfügen stellt ihn wieder her.                                   */
function saveCodeExport() {
  saveGame();
  return "PB1." + btoa(unescape(encodeURIComponent(JSON.stringify(STATE))));
}
function saveCodeImport(code) {
  code = (code || "").trim();
  if (!code.startsWith("PB1.")) throw new Error("Das ist kein Grow-Legends-Code.");
  const raw = decodeURIComponent(escape(atob(code.slice(4))));
  const st = JSON.parse(raw);
  if (!st || !st.inv || !st.pos) throw new Error("Der Code ist unvollständig.");
  applyCloudSave(raw);
  STATE.savedAt = Date.now(); saveGame();
  if (typeof cloudMarkDirty === "function") cloudMarkDirty();
}
function saveCodeBox(mode) {
  const el = document.createElement("div");

    <button id="sc-x" style="flex:1;padding:10px;font:bold 14px monospace;background:#ddd;border:3px solid #383840;border-radius:4px">Schließen</button></div></div>`;
  document.body.appendChild(el);
  const ta = el.querySelector("#sc-text"), msg = t => el.querySelector("#sc-msg").textContent = t;
  ["keydown", "keyup"].forEach(ev => el.addEventListener(ev, e => e.stopPropagation()));
  if (mode === "out") ta.value = saveCodeExport();
  el.querySelector("#sc-x").onclick = () => el.remove();
  el.querySelector("#sc-go").onclick = async () => {

      catch (e) { msg(e.message || "Der Code konnte nicht gelesen werden."); }
    }
  };
}

/* =====================================================================
   30. STADT FÜLLEN – Kleidungsladen, Möbelhaus, Wolfram
   ---------------------------------------------------------------------
   KLEIDUNG: 1 Hose, 1 Oberteil, 3 Accessoires. Hose + Oberteil färben
   die Spielfigur. Boni: Verhandlungsgeschick (mehr Geld beim Verkauf von
   Blüten: Kleidung +1–3 %, Accessoires +3–5 %) und Grüner Daumen
   (Pflanzen wachsen schneller, +5 %).
   MÖBELHAUS (statt Supermarkt): Deko mit Aura (Wert wird vorgemerkt, wirkt

function uweChoose(fits, left, parts) {
  openMenu({
    title: `NOCH ${fmtG(left).toUpperCase()}`,
    items: STATE.buds.filter(fits).map(b => ({ label: STRAINS[b.strain].name + " Q" + b.quality, right: fmtG(b.grams), color: RARITIES[b.rarity].color, bud: b })),
    onCancel: () => { for (const p of parts) addToList(STATE.buds, p, p.grams); normalizeBuds(); saveGame(); },
    onChoose(it) {
      const part = takeFromList(STATE.buds, it.bud, Math.round(Math.min(left, it.bud.grams) * 10) / 10);
      parts.push(part);
      const nl = Math.round((left - part.grams) * 10) / 10;
      if (nl > 0.05) { uweChoose(fits, nl, parts); return; }
      const value = parts.reduce((n, p) => n + p.value, 0), pay = Math.round(value * negoFactor() * 100) / 100;
      STATE.money += pay; setFlag("college_code"); setQuest("handwerker", 3); saveGame(); Sound.floor();
      openDialog(`Du hast Uwe ${UWE_GRAMS} g gegeben und ${euro(pay)} bekommen.\n` +
        "Uwe: Top, das ist ja feinstes Zeug! Pass auf, ich verrat dir was.\n" +
        "Uwe: Im Untergeschoss vom College gibt es Labore – Pflanzenforschung, Genetik, alles Mögliche.\n" +
        `Uwe: Die Tür unten ist mit einem Code gesichert: ${COLLEGE_CODE}. Den hast du nicht von mir, klar?`);

  });

/* =====================================================================
   32. LABOR (Natalie), THC & TERPENE, SORTENVERZEICHNIS IM POKÉDEX-STIL,
       LATERNEN BEI NACHT
   ---------------------------------------------------------------------
   THC:     Jede Sorte hat einen Bereich von 10 % bis zu ihrem Maximum.
            Das Maximum steigt mit dem Tier (T1 bis 18 %, T2 bis 22 %,
            T3 bis 27 %, T4 bis 32 %, T5 bis 38 %). Innerhalb des Tiers
            bekommt jede Sorte ein festes Maximum (Rangfolge der bisherigen
            Stärke). Eine Blüte landet je nach Qualität im Bereich
            (+ kleiner Zufall) – auch legendäre Blüten können 10 % haben.
   Terpene: 0,1 % bis zum Maximum der Sorte (höchstens 3 %), ebenfalls je
            nach Qualität. Jede Sorte hat ein festes Hauptterpen (Geschmack).
   Preis:   bleibt unverändert (THC/Terpene zählen später für Cups und
            Aufträge wie „was mit Zitrus“ oder „was Softes unter 15 %“).
   Sichtbar erst nach Natalies Laborergebnissen (Flag lab_results).
   ===================================================================== */
const THC_MIN = 10, THC_CAP = 38, TERP_MIN = 0.1, TERP_CAP = 3;
const THC_TIER_MAX = [[14, 18], [18, 22], [22, 27], [27, 32], [32, 38]];     // Maximum je Tier: von … bis
const TERP_TIER_MAX = [[1.0, 1.5], [1.4, 1.9], [1.8, 2.3], [2.2, 2.6], [2.5, 3.0]];
const TERPENES = {
  myrcen:       { name: "Myrcen",       taste: "erdig",    color: "#6a8a3a" },
  limonen:      { name: "Limonen",      taste: "Zitrus",   color: "#d8b820" },
  caryophyllen: { name: "Caryophyllen", taste: "pfeffrig", color: "#b05a30" },
  pinen:        { name: "Pinen",        taste: "Kiefer",   color: "#2e7a48" },
  linalool:     { name: "Linalool",     taste: "blumig",   color: "#9a70c8" },
  terpinolen:   { name: "Terpinolen",   taste: "fruchtig", color: "#40a0a0" },
  humulen:      { name: "Humulen",      taste: "holzig",   color: "#8a6a40" },
  ocimen:       { name: "Ocimen",       taste: "süß",      color: "#e07890" },
};
// Hauptterpen: Startsorten + bekannte Kreuzungen fest, alle anderen erben vom ersten Elternteil
const TERP_OF = {
  afghani: "myrcen", northern_lights: "myrcen", skunk1: "myrcen", haze: "terpinolen", durban_poison: "terpinolen",
  acapulco_gold: "caryophyllen", colombian_gold: "pinen", thai: "terpinolen", hindu_kush: "caryophyllen", blueberry: "myrcen",
  white_widow: "pinen", ak_47: "myrcen", jack_herer: "terpinolen", super_skunk: "caryophyllen", cheese: "caryophyllen",
  northern_lights_5: "myrcen", sour_diesel: "caryophyllen", og_kush: "limonen", g13: "myrcen", hash_plant: "humulen",
  big_bud: "myrcen", maui_wowie: "ocimen", pineapple_express: "ocimen", bubble_gum: "linalool", burma: "pinen",
  girl_scout_cookies: "caryophyllen", pink_panties: "linalool", sunset_sherbet: "limonen", gelato: "caryophyllen",
  zkittlez: "ocimen", wedding_cake: "limonen", lemon_cherry_gelato: "limonen", permanent_marker: "caryophyllen",
};
// Werte je Sorte festlegen (fest, ohne Zufall)
for (let t = 1; t <= 5; t++) {
  const ids = STRAIN_LIST.filter(k => STRAINS[k].tier === t);
  const rank = (key) => [...ids].sort((a, b) => STRAINS[a][key] - STRAINS[b][key] || STRAINS[a].nr - STRAINS[b].nr);
  const byS = rank("strength"), byQ = rank("quality"), n = Math.max(1, ids.length - 1);
  const [tl, th] = THC_TIER_MAX[t - 1], [pl, ph] = TERP_TIER_MAX[t - 1];
  byS.forEach((k, i) => { STRAINS[k].thcMax = Math.round((tl + (th - tl) * i / n) * 10) / 10; });
  byQ.forEach((k, i) => { STRAINS[k].terpMax = Math.round((pl + (ph - pl) * i / n) * 100) / 100; });
}
for (const k of STRAIN_LIST) {
  const s = STRAINS[k];
  s.terp = TERP_OF[k] || (s.parents && STRAINS[s.parents[0]].terp) || "myrcen";
}
const labDone = () => !!(STATE && flag("lab_results"));
const labPct = (v, d = 1) => v.toFixed(d).replace(".", ",") + " %";
// Werte einer Blüte aus der Qualität (r = kleiner Zufall; bei alten Spielständen 0)
function budLabValues(strain, q, r) {
  const s = STRAINS[strain], f = clamp(q, 0, 100) / 100;
  const thc = clamp(THC_MIN + (s.thcMax - THC_MIN) * f + (r ? rnd(-1, 1) : 0), THC_MIN, s.thcMax);
  const terp = clamp(TERP_MIN + (s.terpMax - TERP_MIN) * f + (r ? rnd(-0.1, 0.1) : 0), TERP_MIN, s.terpMax);
  return { thc: Math.round(thc * 10) / 10, terp: Math.round(terp * 100) / 100 };
}
function bestNote(b) {
  if (b.owner) return;
  const best = (STATE.dexBest = STATE.dexBest || {}), cur = best[b.strain];
  best[b.strain] = { thc: Math.max(cur ? cur.thc : 0, b.thc), terp: Math.max(cur ? cur.terp : 0, b.terp) };
}
const _harvestBudLab = harvestBud;
harvestBud = function (tent, slot) {
  const b = _harvestBudLab(tent, slot);
  Object.assign(b, budLabValues(b.strain, b.quality, true));
  bestNote(b); saveGame();
  return b;
};
const _loadGameLab = loadGame;
loadGame = function () {
  const r = _loadGameLab();
  if (STATE) {
    for (const b of [...STATE.buds, ...(STATE.stash || [])]) if (b.thc == null) { Object.assign(b, budLabValues(b.strain, b.quality, false)); bestNote(b); }
    if (questStep("handwerker") >= 3 && questStep("labor") < 0) STATE.quests.labor = 0;
  }
  return r;
};
budInfo = function (b) {
  const s = STRAINS[b.strain], lab = labDone() && b.thc != null;
  return `${s.name} · ${RARITIES[b.rarity].name}\n` +
    `Qualität ${b.quality} · THC ${lab ? labPct(b.thc) : "ungetestet"}\n` +
    (lab ? `Terpene ${labPct(b.terp, 2)} · ${TERPENES[s.terp].name} (${TERPENES[s.terp].taste})\n` : "") +
    `${fmtG(b.grams)} · Wert ${euro(b.value)} (${euro(b.value / b.grams)}/g)`;
};

function drawDexBud(c, cx, cy, sc, id, dark) {

      let col = n > 0.72 ? dk : n < 0.18 ? lt : base;
      if (x > w * 0.45) col = n > 0.4 ? dk : base;          // Schatten rechts
      if (x < -w * 0.5 && n < 0.45) col = lt;                // Licht links
      P(x, top + y, edge ? C.ink : col);
    }
    if (y === 0 || y === H - 1) for (let x = -w; x <= w; x++) P(x, top + y + (y === 0 ? -1 : 1), C.ink);

}

function pollenDanger(tent) {
  const own = tent.plants.filter(p => p && !p.owner);
  return own.some(p => isPollenPlant(p) && plantProgress(p) >= POLLEN_FROM) && own.some(p => !isPollenPlant(p) && !p.pollen && plantStage(p) >= BLOOM_STAGE);
}
function skipGameTime(skipMin, wakeText) {
  const skipMs = skipMin / GAME_MIN_PER_REAL_SEC * 1000;
  GAME.fade = { t: 0, phase: "out", dur: 0.6, hold: 1.2, mapId: GAME.mapId, spawn: null, keepPos: true,
    after: () => {
      simulateTent();
      let danger = false;
      for (const tent of STATE.tents) {
        // Schonfrist: bis man das Zelt angeschaut hat, wird nicht bestäubt
        if (tent.plants.some(p => p && !p.owner && isPollenPlant(p))) tent.pollenHold = true;
        for (const pl of tent.plants) if (pl) {
          // Pflanzen wachsen mit – ohne Wassermangel – und sind danach durstig
          const total = plantTotalMs(pl), speed = plantSpeed(pl, tent);
          const used = Math.min(skipMs, Math.max(0, (total - pl.growMs) / speed));
          pl.growMs = Math.min(total, pl.growMs + used * speed);
          pl.wetMs += used;
          pl.last = now();
          if (!tentAddon(tent, "water")) pl.water = 0;
        }
        if (tent.pollenHold && pollenDanger(tent)) danger = true;
      }
      for (const j of (STATE.runner || [])) { j.readyAt -= skipMs; if (j.startAt) j.startAt -= skipMs; }
      STATE.clockOffset = (STATE.clockOffset || 0) + skipMin;
      saveGame();
      checkRunner();
      think(wakeText + (danger ? "\nAchtung: Männliche Pflanzen stehen in der Blüte! Schau ins Zelt und entferne sie, bevor du es wieder verlässt – sonst werden die Weibchen bestäubt." : ""));
    } };
}
sleepUntilMorning = function () {
  const skipMin = ((WAKE_AT * 60 - gameMinuteOfDay()) + 1440) % 1440;
  skipGameTime(skipMin, "Guten Morgen! Es ist 8:00 Uhr.\nDeine Pflanzen sind über Nacht gewachsen – und haben Durst.");
  Sound.tone(392, 0.5, "sine", 0.05); Sound.tone(330, 0.7, "sine", 0.05, 0.4);
};
// Zelt ansehen: Warnung; beim Verlassen endet die Schonfrist
const _openTentTS = openTent;
openTent = function (tent) {
  _openTentTS(tent);
  if (tent.pollenHold && pollenDanger(tent))
    openDialog("Achtung: Die männlichen Pflanzen (♂) geben Pollen ab!\nEntferne sie jetzt – sobald du das Zelt verlässt, werden sonst die blühenden Weibchen bestäubt.");
};
const _closeTentTS = closeTent;
closeTent = function () {
  const tent = GAME.screen && GAME.screen.tent;
  if (tent && tent.pollenHold) { delete tent.pollenHold; checkPollination(tent); }
  _closeTentTS();
};

/* ---------------------------- FERNSEHER ---------------------------- */
const TV_TYPES = ["tv", "tvWall"];
const _buildMapTV = buildMap;
buildMap = function (id) {
  const m = _buildMapTV(id);
  for (const o of m.objects) if (TV_TYPES.includes(o.type)) o.interact = { kind: "tvWait", hint: "Fernseher" };
  return m;
};
CUSTOM_INTERACTIONS.tvWait = () => {
  Sound.select();
  if (!isHomeMap(GAME.mapId)) { openDialog("Im Fernsehen läuft gerade nichts Spannendes."); return; }
  openMenu({
    title: "FERNSEHEN – WIE LANGE?",
    items: Array.from({ length: TV_MAX_H }, (_, i) => ({ label: `${i + 1} ${i ? "Stunden" : "Stunde"}`, right: "bis " + clockAt(gameMinuteOfDay() + (i + 1) * 60), h: i + 1 })),
    onChoose(it) {
      closeAllMenus();
      const end = clockAt(gameMinuteOfDay() + it.h * 60);
      skipGameTime(it.h * 60, `Du hast ${it.h} ${it.h > 1 ? "Stunden" : "Stunde"} ferngesehen. Es ist jetzt ${end} Uhr.\nDeine Pflanzen sind gewachsen – und haben Durst.`);
      Sound.tone(523, 0.2, "square", 0.03); Sound.tone(392, 0.3, "square", 0.03, 0.2);
    },
  });
};

/* ---------------------------------------------------------------------
   START
   --------------------------------------------------------------------- */
function init() {
  buildPlayerSprites();
  setupTouch();
  const mb = document.getElementById("mute");
  if (mb) mb.addEventListener("click", () => { Sound.unlock(); toggleMute(); });
  window.addEventListener("resize", resize);
  resize();
  const hadSave = loadGame();
  // Spielstand: an letzter Position weiterspielen, sonst vor dem Haupteingang
  const pos = STATE.pos;
  // Position nur übernehmen, wenn sie auf der (evtl. geänderten) Karte noch begehbar ist
  const posOk = pos && MAPS[pos.map] && (pos.map !== "outside" || STATE.cityVersion === CITY_VERSION) && !isBlocked(getMap(pos.map), pos.x, pos.y);
  STATE.cityVersion = CITY_VERSION;
  if (hadSave && posOk) {
    placePlayer(pos.map, null);
    Object.assign(GAME.player, { x: pos.x, y: pos.y, dir: pos.dir || "down" });
    updateCamera();
  } else placePlayer(START.map, START.spawn);
  simulateTent();
  showBanner(GAME.map.def.name);
  // beim Schließen/Wechseln des Tabs speichern
  window.addEventListener("pagehide", saveGame);
  document.addEventListener("visibilitychange", () => { if (document.hidden) { simulateTent(); saveGame(); } });
  requestAnimationFrame(loop);
}
// Online-Version (eigene Seite mit Login): das Spiel startet erst nach dem Einloggen
if (!window.POKEBUDS_ONLINE) init();

</script>
<script>
/* =====================================================================
   POKÉBUDS ONLINE – Login (Benutzername + Passwort) und Cloud-Spielstand
   ---------------------------------------------------------------------
   Datenbank: Supabase (Tabellen saves, save_backups, profiles – siehe
   supabase_setup.sql). Benutzername wird intern zu einer Schein-E-Mail
   <name>@spieler.growlegends.app (keine echte Mail, keine Bestätigung).
   Ablauf:
     1. Login/Registrieren (Sitzung bleibt gespeichert → automatisch drin)
     2. Spielstand aus der Datenbank laden, erst DANN startet das Spiel.
        Klappt das Laden nicht, startet das Spiel nicht (kein Überschreiben).
     3. Speichern: alle 15 s bei Änderung, beim Menü „Speichern“ und beim
        Verlassen der Seite. Die Datenbank legt automatisch Backups an
        (höchstens alle 30 min eins, die letzten 30 bleiben).
   ===================================================================== */
const ONLINE = { sb: null, user: null, name: "", dirty: false, busy: false, last: "", ok: false, cloudProgress: 0 };
const NAME_DOMAIN = "spieler.growlegends.app";
const OWNER_KEY = "pokebuds_owner";
const nameToEmail = n => n.toLowerCase() + "@" + NAME_DOMAIN;
cloudMarkDirty = function () { ONLINE.dirty = true; };

/* ---------------------------- LOGIN-FENSTER ---------------------------- */
function loginUI() {
  const el = document.createElement("div");
  el.id = "login";
  el.innerHTML = `
    <div class="lg-box">
      <div class="lg-title">GROW<br>LEGENDS</div>
      <div class="lg-tabs"><button data-t="in" class="on">Einloggen</button><button data-t="up">Registrieren</button></div>
      <label>Spielername<input id="lg-name" autocomplete="username" maxlength="16" autocapitalize="off" spellcheck="false"></label>
      <label>Passwort<input id="lg-pass" type="password" autocomplete="current-password" maxlength="64"></label>
      <label id="lg-pass2-l" hidden>Passwort wiederholen<input id="lg-pass2" type="password" autocomplete="new-password" maxlength="64"></label>
      <button id="lg-go" class="lg-go">Einloggen</button>
      <div id="lg-msg"></div>
      <div class="lg-hint">Spielername: 3–16 Zeichen (a–z, 0–9, _). Passwort: mind. 6 Zeichen.<br>Merk dir dein Passwort gut – es gibt keine E-Mail zum Zurücksetzen.</div>
    </div>`;
  document.body.appendChild(el);
  let mode = "in";
  const $ = id => el.querySelector("#" + id), msg = t => { $("lg-msg").textContent = t; };
  el.querySelectorAll(".lg-tabs button").forEach(b => b.onclick = () => {
    mode = b.dataset.t;
    el.querySelectorAll(".lg-tabs button").forEach(x => x.classList.toggle("on", x === b));
    $("lg-pass2-l").hidden = mode !== "up";
    $("lg-go").textContent = mode === "up" ? "Konto anlegen" : "Einloggen";
    $("lg-pass").autocomplete = mode === "up" ? "new-password" : "current-password";
    msg("");
  });
  const go = async () => {
    const name = $("lg-name").value.trim(), pass = $("lg-pass").value;
    if (!/^[a-zA-Z0-9_]{3,16}$/.test(name)) return msg("Spielername: 3–16 Zeichen, nur Buchstaben, Zahlen und _.");
    if (pass.length < 6) return msg("Das Passwort braucht mindestens 6 Zeichen.");
    if (mode === "up" && pass !== $("lg-pass2").value) return msg("Die Passwörter sind nicht gleich.");
    $("lg-go").disabled = true; msg(mode === "up" ? "Konto wird angelegt …" : "Einloggen …");
    try {
      const email = nameToEmail(name);
      const r = mode === "up"
        ? await ONLINE.sb.auth.signUp({ email, password: pass, options: { data: { username: name } } })
        : await ONLINE.sb.auth.signInWithPassword({ email, password: pass });
      if (r.error) throw r.error;
      if (!r.data.session) throw new Error("Keine Sitzung – ist in Supabase „Confirm email“ ausgeschaltet?");
      await afterLogin(r.data.session.user);
    } catch (e) {
      const m = String((e && e.message) || e);
      msg(/already registered|already exists/i.test(m) ? "Diesen Spielernamen gibt es schon."
        : /invalid login/i.test(m) ? "Spielername oder Passwort falsch."
        : "Fehler: " + m);
    }
    $("lg-go").disabled = false;
  };
  $("lg-go").onclick = go;
  el.addEventListener("keydown", e => { if (e.key === "Enter") go(); e.stopPropagation(); });
  el.addEventListener("keyup", e => e.stopPropagation());
  return el;
}
function loginMsg(t) { const m = document.getElementById("lg-msg"); if (m) m.textContent = t; }

/* ---------------------------- LADEN ---------------------------- */
async function afterLogin(user) {
  ONLINE.user = user;
  ONLINE.name = (user.user_metadata && user.user_metadata.username) || user.email.split("@")[0];
  loginMsg("Spielstand wird geladen …");
  const { data, error } = await ONLINE.sb.from("saves").select("data, saved_at, progress").eq("user_id", user.id).maybeSingle();
  if (error) { loginMsg("Spielstand konnte nicht geladen werden (" + error.message + "). Bitte nochmal versuchen."); return false; }
  // Lokaler Stand zählt nur, wenn er zu DIESEM Konto gehört (und neuer + mind. so weit ist)
  let localRaw = null;
  try { if (localStorage.getItem(OWNER_KEY) === user.id) localRaw = localStorage.getItem(SAVE_KEY); } catch (e) { }
  let raw = data ? JSON.stringify(data.data) : null;
  ONLINE.cloudProgress = data ? data.progress : 0;
  if (localRaw) {
    try {
      const l = JSON.parse(localRaw);
      if (!raw || ((l.savedAt || 0) > (data.data.savedAt || 0) && saveProgress(l) >= ONLINE.cloudProgress)) raw = localRaw;
    } catch (e) { }
  }
  try {
    if (raw) localStorage.setItem(SAVE_KEY, raw); else localStorage.removeItem(SAVE_KEY);
    localStorage.setItem(OWNER_KEY, user.id);
  } catch (e) { GAME.cloudRaw = raw; }
  ONLINE.ok = true;
  ONLINE.last = data ? JSON.stringify(data.data) : "";
  const el = document.getElementById("login"); if (el) el.remove();
  init();
  GAME.cloudRaw = null;
  ONLINE.dirty = true; onlinePush();
  setTimeout(() => showBanner("Hallo " + ONLINE.name + "!"), 900);
  return true;
}

/* ---------------------------- SPEICHERN ---------------------------- */
async function onlinePush(force) {
  if (!ONLINE.ok || ONLINE.busy || !STATE || (!ONLINE.dirty && !force)) return ONLINE.ok;
  const raw = JSON.stringify(STATE);
  if (raw === ONLINE.last) { ONLINE.dirty = false; return true; }
  ONLINE.busy = true; ONLINE.dirty = false;
  const prog = saveProgress(STATE);
  const { error } = await ONLINE.sb.from("saves").upsert({ user_id: ONLINE.user.id, data: STATE, progress: prog, saved_at: new Date().toISOString() });
  ONLINE.busy = false;
  if (error) { ONLINE.dirty = true; ONLINE.err = error.message; return false; }
  ONLINE.last = raw; ONLINE.cloudProgress = prog; ONLINE.err = null;
  return true;
}
setInterval(() => onlinePush(), 15000);
window.addEventListener("pagehide", () => { if (STATE) { ONLINE.dirty = true; onlinePush(); } });
document.addEventListener("visibilitychange", () => { if (document.hidden && STATE) { ONLINE.dirty = true; onlinePush(); } });

/* ---------------------------- MENÜ: KONTO ---------------------------- */
const ADMIN_NAME = "admin";
const isAdmin = () => (ONLINE.name || "").toLowerCase() === ADMIN_NAME;
const _openMainMenuOnline = openMainMenu;
openMainMenu = function () {
  _openMainMenuOnline();
  const m = GAME.menus[GAME.menus.length - 1];
  // Schummel-Schalter nur für das Konto „admin“
  if (!isAdmin()) m.items = m.items.filter(it => it.id !== "debug");
  const i = m.items.findIndex(it => it.id === "save");
  if (i >= 0) m.items.splice(i + 1, 0, { label: "Konto", id: "account" });
  const orig = m.onChoose;
  m.onChoose = (item, idx) => {
    if (item.id === "save") {
      saveGame(); openDialog("Speichere …");
      const wait = ONLINE.busy ? new Promise(r => setTimeout(r, 1500)) : Promise.resolve();
      wait.then(() => onlinePush(true)).then(ok => { GAME.dialog = null; openDialog(ok ? `Spiel gespeichert – in deinem Konto „${ONLINE.name}“.` : "Gerade keine Verbindung. Ich speichere automatisch, sobald es wieder geht."); });
      return;
    }
    if (item.id === "account") { openAccountMenu(); return; }
    return orig(item, idx);
  };
};
function openAccountMenu() {
  openMenu({
    title: "KONTO: " + ONLINE.name.toUpperCase(),
    items: [{ label: "Backup laden", id: "backup" }, { label: "Abmelden", id: "logout" }],
    onChoose(it) {
      if (it.id === "logout") {
        openDialog("Wirklich abmelden? Dein Spielstand wird vorher gespeichert.", ["Abmelden", "Abbrechen"], async c => {
          if (c !== 0) return;
          saveGame(); await onlinePush(true);
          await ONLINE.sb.auth.signOut();
          try { localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OWNER_KEY); } catch (e) { }
          location.reload();
        });
      } else openBackupMenu();
    },
  });
}
async function openBackupMenu() {
  const { data, error } = await ONLINE.sb.from("save_backups").select("id, saved_at, progress").eq("user_id", ONLINE.user.id).order("saved_at", { ascending: false }).limit(30);
  if (error) { openDialog("Backups konnten nicht geladen werden."); return; }
  if (!data.length) { openDialog("Noch keine Backups vorhanden. Es wird höchstens alle 30 Minuten eins angelegt."); return; }
  const fmt = iso => { const d = new Date(iso); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " " + d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }); };
  openMenu({
    title: "BACKUP LADEN",
    items: data.map(b => ({ label: fmt(b.saved_at), right: "Fortschritt " + Math.floor(b.progress / 1000), id: b.id })),
    onChoose(it) {
      openDialog(`Backup vom ${it.label} laden?\nDein jetziger Stand wird dabei ersetzt (er landet selbst als Backup in der Liste).`, ["Laden", "Abbrechen"], async c => {
        if (c !== 0) return;
        const r = await ONLINE.sb.from("save_backups").select("data").eq("id", it.id).single();
        if (r.error) { openDialog("Das Backup konnte nicht geladen werden."); return; }
        saveGame(); await onlinePush(true);
        applyCloudSave(JSON.stringify(r.data.data));
        ONLINE.dirty = true; await onlinePush(true);
      });
    },
  });
}

/* ---------------------------- START ---------------------------- */
(async function onlineStart() {
  const cfg = window.POKEBUDS_CONFIG || {};
  const ui = loginUI();
  if (!window.supabase || !cfg.url || !cfg.key || cfg.url.includes("DEIN")) { loginMsg("Die Datenbank ist noch nicht eingerichtet (Konfiguration fehlt)."); ui.querySelector("#lg-go").disabled = true; return; }
  ONLINE.sb = window.supabase.createClient(cfg.url, cfg.key, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "pokebuds_auth" } });
  const { data } = await ONLINE.sb.auth.getSession();
  if (data && data.session) {
    const b = ui.querySelector("#lg-go"); b.disabled = true;
    if (await afterLogin(data.session.user)) return;
    // Laden fehlgeschlagen: mit derselben Sitzung erneut versuchen
    b.disabled = false; b.textContent = "Nochmal versuchen";
    b.onclick = async () => { b.disabled = true; if (!(await afterLogin(data.session.user))) b.disabled = false; };
  }
})();

</script>
